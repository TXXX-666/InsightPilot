[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insightpilot"
version = "0.1.0"
description = "Real-time multi-agent research and monitoring platform"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "anthropic>=0.40.0",
  "openai>=1.50.0",
  "rich>=13.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "beautifulsoup4>=4.12.3",
  "apscheduler>=3.10.4",
  "streamlit>=1.38.0",
  "pandas>=2.2.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "openpyxl>=3.1.5",
  "reportlab>=4.2.0",
  "mcp>=1.29.0,<2.0.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.46.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
insightpilot = "insightpilot.__main__:main"
insightpilot-api = "insightpilot.api:main"

[tool.setuptools.packages.find]
include = ["insightpilot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
